name: Deploy a published Docker release
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of a tested master commit published to GHCR
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy the selected release
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/mtgdle_ci_key' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/mtgdle_ci_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$GH_TOKEN" | ssh -i ~/.ssh/mtgdle_ci_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "sudo -n /opt/mtgdle/deploy/release.sh $RELEASE_SHA --registry-token-stdin"
