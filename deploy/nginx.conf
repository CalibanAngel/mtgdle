limit_req_zone $binary_remote_addr zone=game:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=5r/m;
map "$realip_remote_addr:$http_x_forwarded_proto" $forwarded_scheme {
    default $scheme;
    "172.30.50.5:https" https;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    set_real_ip_from 172.30.50.5;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/admin/auth/login {
        limit_except POST { deny all; }
        limit_req zone=admin_login burst=4 nodelay;
        include /etc/nginx/game-proxy.conf;
    }
    location ~ "^/api/admin(/|$)" {
        client_max_body_size 32k;
        limit_except GET POST { deny all; }
        include /etc/nginx/game-proxy.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /admin {
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    location ~ "^/api/classic/(today|[0-9]{4}-[0-9]{2}-[0-9]{2}/art)$" {
        limit_except GET { deny all; }
        include /etc/nginx/game-proxy.conf;
    }
    location ~ "^/api/classic/[0-9]{4}-[0-9]{2}-[0-9]{2}/(guesses|hint|abandon)$" {
        limit_except POST { deny all; }
        include /etc/nginx/game-proxy.conf;
    }
    location /api { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
